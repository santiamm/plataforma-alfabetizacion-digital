<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Alfabetización Digital</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Iconos de Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <header class="bg-white border-bottom py-3">
        <div class="container d-flex justify-content-between align-items-center">
            <a href="index.html" class="text-decoration-none fw-bold text-primary fs-3">
                <i class="bi bi-arrow-left-circle-fill me-1"></i> Volver al Inicio
            </a>
            <span class="fs-4 text-secondary d-none d-md-inline">Acceso de Usuarios</span>
        </div>
    </header>

    <main class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                
                <div class="card shadow-sm border-0 p-4 p-md-5 bg-white rounded-4">
                    <div class="text-center mb-4">
                        <i class="bi bi-person-circle display-3 text-primary"></i>
                        <h1 class="h2 fw-bold mt-2">Iniciar Sesión</h1>
                        <p class="fs-5 text-muted">Ingresa con tu correo o tu teléfono</p>
                    </div>

                    <!-- Alerta de estado -->
                    <div id="mensaje-alerta" class="alert d-none fs-5 text-center" role="alert"></div>

                    <form id="loginForm" novalidate>
                        <!-- Campo unificado de teléfono o correo -->
                        <div class="mb-4">
                            <label for="identificador" class="form-label fs-5 fw-bold text-dark">
                                <i class="bi bi-person-badge-fill me-1"></i> Correo Electrónico o Teléfono:
                            </label>
                            <input 
                                type="text" 
                                class="form-control form-control-lg fs-5 p-3 rounded-3" 
                                id="identificador" 
                                placeholder="Ej: 3101234567 o maria@correo.com" 
                                required
                            >
                        </div>

                        <!-- Contraseña -->
                        <div class="mb-4">
                            <label for="password" class="form-label fs-5 fw-bold text-dark">
                                <i class="bi bi-key-fill me-1"></i> Tu Contraseña:
                            </label>
                            <div class="input-group">
                                <input 
                                    type="password" 
                                    class="form-control form-control-lg fs-5 p-3 rounded-start-3" 
                                    id="password" 
                                    placeholder="Tu contraseña secreta" 
                                    required
                                >
                                <button 
                                    class="btn btn-outline-secondary px-3" 
                                    type="button" 
                                    id="btnTogglePassword" 
                                    title="Mostrar u ocultar contraseña"
                                >
                                    <i class="bi bi-eye-fill fs-4" id="iconoOjo"></i>
                                </button>
                            </div>
                        </div>

                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary btn-lg py-3 fs-4 fw-semibold rounded-pill shadow-sm">
                                <i class="bi bi-box-arrow-in-right me-2"></i> Entrar a la Plataforma
                            </button>
                        </div>
                    </form>

                    <hr class="my-4">

                    <div class="text-center">
                        <p class="fs-5 text-muted mb-2">¿Todavía no tienes una cuenta?</p>
                        <a href="registro.html" class="fw-bold fs-5 text-success text-decoration-none">
                            <i class="bi bi-person-plus-fill me-1"></i> Regístrate aquí gratis
                        </a>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <footer class="bg-white border-top py-3 text-center text-muted fs-6 mt-auto">
        <div class="container">
            <p class="mb-0">Plataforma de Alfabetización Digital - UTS</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
