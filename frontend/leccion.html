            cuerpoDinamico.innerHTML = contenido.html;

            // 4. Accesibilidad: Aumentar y Disminuir Letra
            const btnAumentar = document.getElementById('btnAumentarTexto');
            const btnDisminuir = document.getElementById('btnDisminuirTexto');
            const contenedorTexto = document.getElementById('contenidoLeccion');

            if (btnAumentar && btnDisminuir && contenedorTexto) {
                let zoom = 1.0;
                btnAumentar.addEventListener('click', () => {
                    if (zoom < 1.35) { zoom += 0.1; aplicarZoom(); }
                });
                btnDisminuir.addEventListener('click', () => {
                    if (zoom > 0.9) { zoom -= 0.1; aplicarZoom(); }
                });
                function aplicarZoom() {
                    const els = contenedorTexto.querySelectorAll('h1, h2, h3, h4, p, li, strong, span');
                    els.forEach(el => {
                        if (!el.dataset.baseSize) {
                            el.dataset.baseSize = parseFloat(window.getComputedStyle(el).fontSize);
                        }
                        el.style.fontSize = `${parseFloat(el.dataset.baseSize) * zoom}px`;
                    });
                }
            }
        });
