<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio - Plataforma de Alfabetización Digital</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/accesibilidad.js"></script>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <header class="bg-white border-bottom py-3">
        <div class="container d-flex flex-wrap justify-content-between align-items-center gap-2">
            <span class="fw-bold text-primary fs-3">
                <i class="bi bi-laptop"></i> Alfabetización Digital
            </span>
            <a href="#ayuda" class="btn btn-outline-secondary btn-lg fs-5">
                <i class="bi bi-question-circle-fill"></i> ¿Necesitas Ayuda?
            </a>
        </div>
    </header>

    <main class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-8 text-center">

                <h1 class="display-4 fw-bold text-dark mb-4">
                    Aprende a usar la tecnología de forma fácil y segura
                </h1>

                <p class="fs-4 text-muted mb-5">
                    Un espacio guiado para practicar y aprender paso a paso, a tu propio ritmo.
                </p>

                <div class="card shadow-sm border-0 p-4 p-md-5 bg-white rounded-4">
                    <div class="d-grid gap-4 col-12 col-md-10 mx-auto">

                        <a href="login.html" class="btn btn-primary btn-lg py-3 fs-3 fw-semibold rounded-pill shadow-sm">
                            <i class="bi bi-box-arrow-in-right me-2"></i> Iniciar Sesión
                        </a>

                        <a href="registro.html" class="btn btn-success btn-lg py-3 fs-3 fw-semibold rounded-pill shadow-sm">
                            <i class="bi bi-person-plus-fill me-2"></i> Crear Cuenta Nueva
                        </a>

                    </div>
                </div>

            </div>
        </div>
    </main>

    <footer class="bg-white border-top py-3 text-center text-muted fs-6 mt-auto">
        <div class="container">
            <p class="mb-0">Plataforma Educativa Adaptada - Unidades Tecnológicas de Santander</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
