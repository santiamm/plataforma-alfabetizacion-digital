<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Panel - Alfabetización Digital</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Iconos de Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Barra de Navegación Principal -->
    <header class="bg-white border-bottom py-3">
        <div class="container d-flex justify-content-between align-items-center">
            <span class="fw-bold text-primary fs-3">
                <i class="bi bi-laptop"></i> Alfabetización Digital
            </span>
            <div class="d-flex gap-2">
                <a href="login.html" id="btnCerrarSesion" class="btn btn-outline-danger btn-lg fs-5" title="Salir de mi cuenta">
                    <i class="bi bi-box-arrow-right me-1"></i> Salir
                </a>
            </div>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="container py-4 flex-grow-1">
        
        <!-- Saludo y Progreso General -->
        <section class="card shadow-sm border-0 p-4 bg-white rounded-4 mb-4">
            <div class="row align-items-center">
                <div class="col-12 col-md-8">
                    <h1 class="h2 fw-bold text-dark mb-1">
                        ¡Hola, <span id="nombreUsuario">Estudiante</span>!
                    </h1>
                    <p class="fs-5 text-muted mb-3">
                        Bienvenido a tus clases. Elige el tema en el que deseas practicar hoy:
                    </p>
                </div>
                
                <!-- Barra de Progreso Visual -->
                <div class="col-12 col-md-4">
                    <div class="p-3 bg-light rounded-3 border">
                        <div class="d-flex justify-content-between mb-1">
                            <span class="fw-bold fs-6">Tu Progreso Total:</span>
                            <span class="fw-bold fs-6 text-primary" id="porcentajeTotal">0%</span>
                        </div>
                        <div class="progress" style="height: 20px;" role="progressbar" aria-label="Progreso general">
                            <div id="barraProgreso" class="progress-bar bg-success progress-bar-striped progress-bar-animated" style="width: 0%"></div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Listado de Módulos de Aprendizaje -->
        <h2 class="h3 fw-bold text-dark mb-3">
            <i class="bi bi-journal-bookmark-fill text-primary me-2"></i>Módulos de Aprendizaje
        </h2>

        <!-- Contenedor dinámico donde se inyectan las tarjetas desde SQLite/Flask -->
        <div class="row g-4" id="contenedorModulos">
            <!-- Cargando módulos... -->
        </div>

    </main>

    <!-- Pie de página -->
    <footer class="bg-white border-top py-3 text-center text-muted fs-6 mt-auto">
        <div class="container">
            <p class="mb-0">Plataforma de Alfabetización Digital - UTS</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
